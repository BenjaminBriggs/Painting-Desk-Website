# Netlify publishes the repo root (no build step). Config lives here only: no _redirects file.

# Pinned here so the dashboard's build settings can't publish anything else
[build]
  publish = "."

# Every response: no sniffing, no framing, no referrer path to other sites
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Universal links, if the app adopts them (SPEC.md §11.4): the association file must be JSON
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"

# Hide repo files that aren't part of the site
[[redirects]]
  from = "/SPEC.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/images/models/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Unknown paths fall through to Netlify's 404.html
